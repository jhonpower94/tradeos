# HTTP: ACME challenges + healthcheck; everything else → HTTPS apex
server {
  listen 80 default_server;
  server_name tradingos.tech www.tradingos.tech _;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location / {
    return 301 https://tradingos.tech$request_uri;
  }
}

# www → apex on HTTPS
server {
  listen 443 ssl;
  http2 on;
  server_name www.tradingos.tech;

  ssl_certificate /etc/letsencrypt/live/tradingos.tech/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/tradingos.tech/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_session_tickets off;

  return 301 https://tradingos.tech$request_uri;
}

# HTTPS apex: SPA + API/WS proxy
server {
  listen 443 ssl;
  http2 on;
  server_name tradingos.tech;
  root /usr/share/nginx/html;
  index index.html;

  ssl_certificate /etc/letsencrypt/live/tradingos.tech/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/tradingos.tech/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_session_tickets off;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

  types {
    application/manifest+json webmanifest;
  }

  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }

  location /api/ {
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /ws {
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
